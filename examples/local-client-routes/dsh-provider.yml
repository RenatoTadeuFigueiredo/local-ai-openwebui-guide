# Merge into the home patch layer of your dsh profile: ~/.dsh/cordis.patch.yml
# The key stays out of this file: apiKeyEnv reads ~/.dsh/.env.
- id: llm-pi-ai
  config:
    providers:
      local-omlx:
        displayName: Local oMLX
        api: openai-completions
        baseURL: http://127.0.0.1:8084/v1
        apiKeyEnv: OMLX_LOCAL_KEY
        timeoutMs: 900000
        models:
          - id: sage-a15-omlx
            name: Sage A1.5 (local, oQ4e)
            contextWindow: 262144
            maxTokens: 8192
          - id: qwen38-omlx
            name: Qwen3.8 27B (local, oQ4e)
            contextWindow: 262144
            maxTokens: 8192
